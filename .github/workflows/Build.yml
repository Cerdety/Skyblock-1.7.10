name: Build Skyblock Mod

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --stacktrace --no-daemon

      - name: Upload mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Skyblock-Mod
          path: build/libs/*.jar
